{% extends 'base.html' %}{% block title %}Settings{% endblock %}{% block content %}<div class="page-head"><div><div class="eyebrow">ACCOUNT</div><h1>Settings</h1><p>Manage your profile and sign-in details.</p></div></div><div class="panel form-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input required maxlength="100" name="name" value="{{ current_user.name }}"></label><label>Email address<input disabled value="{{ current_user.email }}"></label><hr><h2>Change password</h2><label>Current password<input type="password" name="current_password"></label><label>New password<input type="password" minlength="10" name="new_password" placeholder="At least 10 characters"></label><button class="button">Save changes</button></form></div>{% endblock %}
